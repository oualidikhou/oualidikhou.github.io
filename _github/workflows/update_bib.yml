name: Update Publications from BibTeX

on:
  schedule:
    - cron: "0 2 * * *"  # tous les jours à 2h UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install bibtexparser

      - name: Convert BibTeX to JSON
        run: python scripts/bib_to_json.py

      - name: Commit update
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add _data/publications.json
          git diff-index --quiet HEAD || git commit -m "Update publications"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }} || echo "No changes to push"
