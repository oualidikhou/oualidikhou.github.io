<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | PhD Researcher</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS principal -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">

  <!-- FontAwesome pour les icônes -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Glassmorphism -->
  <nav>
    <div class="nav-container">
      <div class="nav-logo">
        <a href="{{ site.baseurl }}/" class="gradient-text">OI</a>
      </div>
      <div class="search-container">
        <span class="search-logo">MonLogo</span>
        <input type="text" placeholder="Rechercher...">
      </div>
      <ul>
        {% for page in site.nav_pages %}
          <li><a href="{{ site.baseurl }}/{{ page.name }}.html">{{ page.name | capitalize }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </nav>

  <!-- Contenu principal -->
  <main>
    {{ content }}
  </main>

  <!-- Pied de page -->
  <footer>
    <div style="margin-bottom: 2rem;">
      <h3 class="gradient-text">Oualid IKHOU</h3>
      <p>{{ site.affiliation | markdownify | strip_html }}</p>
      <p><i class="fa-solid fa-location-dot" style="margin-right: 8px;"></i> {{ site.location | markdownify | strip_html }}</p>
    </div>
    
    <div style="margin-bottom: 1rem;">
      {{ site.contact }}
    </div>

    <div class="copyright">
      &copy; 2026 Oualid IKHOU. Designed with passion.
    </div>
  </footer>

</body>
</html>
